version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solana_trader_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: solana_trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: solana_trader_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solana_trader
      SECRET_KEY: devsecretkey123456789
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      TRADING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: solana_trader_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/solana_trader
      SOLANA_RPC_URL: https://api.mainnet-beta.solana.com
      TRADING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
