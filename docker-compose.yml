version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: solana_trader_db
    environment:
      POSTGRES_DB: solana_trading_db
      POSTGRES_USER: trader_user
      POSTGRES_PASSWORD: SecurePassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    restart: always

  backend_api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: solana_trader_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: always

  trading_worker:
    build:
      context: ./services/trading-worker
      dockerfile: Dockerfile
    container_name: solana_trader_worker
    env_file:
      - .env
    depends_on:
      - postgres
      - backend_api
    restart: always

volumes:
  postgres-data:
